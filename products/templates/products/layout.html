<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #fff0f5, #ffe6f0);
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: linear-gradient(90deg, #ff4d88, #ff80aa) !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .card {
            border: none;
            border-radius: 16px;
            transition: 0.3s;
            background: white;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(255, 77, 136, 0.25);
        }

        .btn-primary {
            background-color: #ff4d88;
            border: none;
        }

        .btn-primary:hover {
            background-color: #ff1f6b;
        }

        h2, h5 {
            color: #d63384;
        }

        main {
            margin-top: 40px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="{% url 'product_list' %}">
            E-Commerce
        </a>

        <div class="navbar-nav">

            <a class="nav-link text-white" href="{% url 'product_list' %}">
                Produits
            </a>

            <a class="nav-link text-white" href="{% url 'cart' %}">
                Panier
            </a>

            {% if user.is_authenticated %}

                <a class="nav-link text-white" href="{% url 'profile' %}">
                    Profil
                </a>

                <span class="navbar-text text-white mx-2">
                    Bonjour {{ user.username }}
                </span>

                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-sm btn-light">
                        Déconnexion
                    </button>
                </form>

            {% else %}

                <a class="nav-link text-white" href="{% url 'login' %}">
                    Connexion
                </a>

                <a class="nav-link text-white" href="{% url 'signup' %}">
                    Créer compte
                </a>

            {% endif %}

        </div>
    </div>
</nav>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="text-center mt-5 mb-3">
    Copyright © EMI 2026
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
